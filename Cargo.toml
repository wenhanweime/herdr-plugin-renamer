[package]
name = "herdr-plugin-renamer"
version = "0.3.0"
edition = "2021"
description = "Names Herdr sessions and auto-generated worktrees from the agent's first prompt."
authors = ["wenhanweime"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/wenhanweime/herdr-plugin-renamer"
homepage = "https://github.com/wenhanweime/herdr-plugin-renamer"
keywords = ["herdr", "plugin", "worktree", "git", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
libc = "0.2"

[profile.release]
lto = true
strip = true
